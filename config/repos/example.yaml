# yaml-language-server: $schema=../../schemas/repo.json
# Placeholder: replace with the first real repo (PRD open question 4).
apiVersion: shira/v1
kind: Repo
repo: example-org/example-repo
defaultBranch: main
# Must include git, coreutils, util-linux, procps, and the harness: build FROM images/worker.
image: shira-worker:latest
setup:
  - corepack enable
  - pnpm install --frozen-lockfile
test: pnpm test
lint: pnpm lint
flaky:
  quarantine: []
  retries: 1
egress:
  allow: [registry.npmjs.org]
limits: { minutes: 45, cpus: 2, memoryMb: 4096 }
