# Local development database. Tests don't need it (they use PGlite).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: shira
      POSTGRES_PASSWORD: shira
      POSTGRES_DB: shira
    ports:
      - "54329:5432"
    volumes:
      - shira-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shira -d shira -h localhost"]
      interval: 1s
      timeout: 3s
      retries: 30
volumes:
  shira-pg:
