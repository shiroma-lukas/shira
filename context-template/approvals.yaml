# yaml-language-server: $schema=../schemas/approvals.json
# Who may approve which proposals (FR-H2), checked in code before any approval is acted on.
# An identity may approve a proposal when some rule names it (or one of its roles) and
# covers the proposal's repo, risk, and estimated cost. Approvals from anyone else are
# recorded in the task's event log and ignored.
rules:
  - approver_roles: [tech-lead]
    repos: [example-org/*]        # org/name, or org/* for every repo of an org
    max_risk: high                # low | medium | high
    max_estimated_usd: 50
