name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: shira
          POSTGRES_PASSWORD: shira
          POSTGRES_DB: shira_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shira -d shira_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      SHIRA_TEST_DATABASE_URL: postgres://shira:shira@localhost:5432/shira_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm validate-config
      - name: Generated schemas are up to date
        run: |
          pnpm schemas
          if [ -n "$(git status --porcelain schemas)" ]; then
            git status --short schemas
            echo "::error::schemas/ is out of date with src/contracts. Run 'pnpm schemas' and commit the result."
            exit 1
          fi

  # Developer Certificate of Origin: every commit in the PR is signed off by its author.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/check-dco.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
        env:
          # Only PRs the Shira GitHub App opened; an author email alone could be spoofed.
          DCO_EXEMPT_AUTHOR_EMAIL: ${{ github.event.pull_request.user.login == 'shira-github-app[bot]' && 'shira-worker@localhost' || '' }}

  # The Docker sandbox under real gVisor: isolation, egress allowlist, proxy bypass, kill.
  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install gVisor
        run: |
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" \
            | sudo tee /etc/apt/sources.list.d/gvisor.list
          sudo apt-get update && sudo apt-get install -y runsc
          sudo runsc install
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}'
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run test/docker.integration.test.ts
        env:
          SHIRA_TEST_DOCKER: "1"
          SHIRA_TEST_DOCKER_RUNTIME: runsc
