name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: shira
          POSTGRES_PASSWORD: shira
          POSTGRES_DB: shira_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shira -d shira_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      SHIRA_TEST_DATABASE_URL: postgres://shira:shira@localhost:5432/shira_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm validate-config

  # The Docker sandbox under real gVisor: isolation, egress allowlist, proxy bypass, kill.
  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install gVisor
        run: |
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" \
            | sudo tee /etc/apt/sources.list.d/gvisor.list
          sudo apt-get update && sudo apt-get install -y runsc
          sudo runsc install
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}'
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run test/docker.integration.test.ts
        env:
          SHIRA_TEST_DOCKER: "1"
          SHIRA_TEST_DOCKER_RUNTIME: runsc
